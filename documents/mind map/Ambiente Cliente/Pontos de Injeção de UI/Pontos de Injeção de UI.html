atematicamente relevante.","children":[],"payload":{"tag":"li","lines":"8,9"}},{"content":"<strong>Componentes Visuais:</strong> Exibi&#xe7;&#xe3;o da mensagem de alerta (&quot;O Claude &#xe9; 15% mais factual para este contexto&quot;) e dois bot&#xf5;es de a&#xe7;&#xe3;o (&quot;Aceitar Otimiza&#xe7;&#xe3;o&quot; e &quot;Ignorar&quot;).","children":[],"payload":{"tag":"li","lines":"9,11"}}],"payload":{"tag":"h3","lines":"7,8"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"2. Otimiza&#xe7;&#xe3;o Invis&#xed;vel (Query Rewriting)","children":[{"content":"O Desafio dos Frameworks (React/Angular)","children":[{"content":"Sites modernos n&#xe3;o leem diretamente o atributo est&#xe1;tico do HTML. Se a sua extens&#xe3;o fizer apenas <code>textarea.value = &quot;novo texto&quot;</code>, o React (usado no ChatGPT) n&#xe3;o perceber&#xe1; a mudan&#xe7;a, e ao clicar em enviar, o prompt antigo ser&#xe1; despachado.","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"h3","lines":"12,13"}},{"content":"A Solu&#xe7;&#xe3;o via API DOM (Synthetic Events)","children":[{"content":"<strong>Passo 1:</strong> O JavaScript altera fisicamente o valor da caixa (<code>element.value = texto_novo</code>).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Passo 2:</strong> A extens&#xe3;o despacha um evento sint&#xe9;tico de digita&#xe7;&#xe3;o (<code>element.dispatchEvent(new Event(&apos;input&apos;, { bubbles: true }))</code>). Isso &quot;engana&quot; o site, fazendo-o acreditar que o pr&#xf3;prio usu&#xe1;rio digitou o texto otimizado.","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<strong>Passo 3:</strong> Localizar via DOM o bot&#xe3;o nativo de &quot;Enviar&quot; (ex: <code>document.querySelector(&apos;button[data-testid=&quot;send-button&quot;]&apos;)</code>) e acionar o m&#xe9;todo <code>.click()</code> programaticamente.","children":[],"payload":{"tag":"li","lines":"17,19"}}],"payload":{"tag":"h3","lines":"14,15"}}],"payload":{"tag":"h2","lines":"11,12"}},{"content":"3. Medidores de Observabilidade (Tempo Real)","children":[{"content":"Inser&#xe7;&#xe3;o de Elementos (Append Node)","children":[{"content":"<strong>Localiza&#xe7;&#xe3;o:</strong> O script localiza o n&#xf3; pai do bal&#xe3;o de resposta espec&#xed;fico e usa o m&#xe9;todo <code>insertAdjacentElement(&apos;beforeend&apos;, termometroDiv)</code> para acoplar o seu widget ao final ou &#xe0; lateral da resposta.","children":[],"payload":{"tag":"li","lines":"21,22"}}],"payload":{"tag":"h3","lines":"20,21"}},{"content":"Estrutura do Widget (O Term&#xf4;metro)","children":[{"content":"<strong>Container:</strong> Uma <code>div</code> pequena usando <code>display: flex</code> para alinhar os &#xed;cones e barras.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Barra de Fidelidade:</strong> Um elemento <code>&lt;progress&gt;</code> ou uma <code>div</code> com <code>width</code> din&#xe2;mico alterado via JavaScript assim que o JSON do WebSocket chega.","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"<strong>Sinalizador de Entropia:</strong> Um &#xed;cone din&#xe2;mico que altera de cor (usando classes de CSS aplicadas via <code>classList.add()</code>) para alertar incerteza alta.","children":[],"payload":{"tag":"li","lines":"25,26"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"Resili&#xea;ncia do DOM","children":[{"content":"Como o LLM est&#xe1; gerando texto, a p&#xe1;gina costuma re-renderizar o bloco de mensagens inteiro.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"O seu <code>Content Script</code> precisa ter uma fun&#xe7;&#xe3;o de &quot;Auto-Cura&quot; (<em>Self-Healing</em>). Se a interface do Gemini ou ChatGPT apagar acidentalmente a <code>div</code> do seu term&#xf4;metro durante o streaming, a extens&#xe3;o detecta a aus&#xea;ncia e o injeta novamente no lugar correto usando o <code>msg_id</code> salvo na mem&#xf3;ria tempor&#xe1;ria.","children":[],"payload":{"tag":"li","lines":"28,29"}}],"payload":{"tag":"h3","lines":"26,27"}}],"payload":{"tag":"h2","lines":"19,20"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
