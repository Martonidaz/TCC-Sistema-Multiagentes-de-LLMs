<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Desafios de Engenharia Frontend (Edge Cases)","children":[{"content":"1. O Problema das Classes CSS Vol&#xe1;teis (Obfuscation)","children":[{"content":"A Causa","children":[{"content":"Frameworks modernos (React/Tailwind) usados por empresas como OpenAI e Anthropic frequentemente geram classes CSS din&#xe2;micas durante o <em>build</em> (ex: <code>class=&quot;x3v9z w-full flex-col&quot;</code>).","children":[],"payload":{"tag":"li","lines":"4,5"}},{"content":"Uma atualiza&#xe7;&#xe3;o silenciosa no site do ChatGPT muda <code>.x3v9z</code> para <code>.y4w1a</code>, quebrando instantaneamente o <code>document.querySelector</code> da sua extens&#xe3;o.","children":[],"payload":{"tag":"li","lines":"5,6"}}],"payload":{"tag":"h3","lines":"3,4"}},{"content":"A Solu&#xe7;&#xe3;o: Seletores Estruturais Sem&#xe2;nticos","children":[{"content":"Em vez de buscar estilos, a extens&#xe3;o busca &quot;Significados&quot;.","children":[],"payload":{"tag":"li","lines":"7,8"}},{"content":"<strong>Atributos de Acessibilidade (ARIA):</strong> Procurar por <code>[aria-label=&quot;Send message&quot;]</code> ou <code>[aria-label=&quot;Stop generating&quot;]</code>. Esses atributos s&#xe3;o exigidos por lei (para leitores de tela) e raramente s&#xe3;o alterados.","children":[],"payload":{"tag":"li","lines":"8,9"}},{"content":"<strong>Atributos de Teste (Data-TestId):</strong> Usados por engenheiros QA do site (ex: <code>[data-testid=&quot;conversation-turn-3&quot;]</code>). Costumam ser extremamente est&#xe1;veis.","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"<strong>Navega&#xe7;&#xe3;o Relacional (XPath):</strong> Se um elemento n&#xe3;o tem nenhum atributo est&#xe1;vel, o script localiza um &quot;ancoradouro&quot; seguro (como a div principal do chat) e navega atrav&#xe9;s da &#xe1;rvore DOM (&quot;o terceiro filho da div que cont&#xe9;m SVG&quot;).","children":[],"payload":{"tag":"li","lines":"10,12"}}],"payload":{"tag":"h3","lines":"6,7"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"2. O Problema das Single Page Applications (SPAs)","children":[{"content":"A Causa (Navega&#xe7;&#xe3;o sem Refresh)","children":[{"content":"Quando o usu&#xe1;rio clica em um chat antigo na barra lateral esquerda, a p&#xe1;gina n&#xe3;o recarrega (n&#xe3;o d&#xe1; &quot;F5&quot;). O React apenas troca os componentes internos e atualiza a URL via <code>History API</code>.","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"<strong>A Consequ&#xea;ncia:</strong> Se o seu script rodar apenas no <code>window.onload</code>, ele vai injetar o painel no primeiro chat, mas quando o usu&#xe1;rio trocar de conversa, a extens&#xe3;o vai parar de funcionar silenciosamente, misturando m&#xe9;tricas de conversas diferentes.","children":[],"payload":{"tag":"li","lines":"15,16"}}],"payload":{"tag":"h3","lines":"13,14"}},{"content":"A Solu&#xe7;&#xe3;o: Monitoramento de Rota Ativa","children":[{"content":"<strong>Interceptador de URL:</strong> O <code>Content Script</code> substitui as fun&#xe7;&#xf5;es nativas <code>history.pushState</code> e <code>history.replaceState</code> para que a extens&#xe3;o seja avisada imediatamente toda vez que a URL mudar.","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<strong>Vigil&#xe2;ncia no <code>&lt;body&gt;</code>:</strong> Um <code>MutationObserver</code> secund&#xe1;rio fica vigiando a raiz da p&#xe1;gina para detectar trocas massivas de componentes.","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"h3","lines":"16,17"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"3. L&#xf3;gica de &quot;Limpeza&quot; e &quot;Auto-Cura&quot; (Teardown &amp; Healing)","children":[{"content":"O Evento de &quot;Mudan&#xe7;a de Chat&quot; (Context Reset)","children":[{"content":"Assim que a extens&#xe3;o detecta que a URL mudou (o usu&#xe1;rio abriu outra conversa):","children":[{"content":"1. O <code>Content Script</code> destr&#xf3;i imediatamente todos os pain&#xe9;is e &quot;Term&#xf4;metros&quot; da tela atual.","children":[],"payload":{"tag":"li","lines":"23,24","listIndex":1}},{"content":"2. Envia um sinal para o <code>Service Worker</code> e para o Servidor Edge (FastAPI): <code>{ &quot;action&quot;: &quot;reset_context&quot; }</code>.","children":[],"payload":{"tag":"li","lines":"24,25","listIndex":2}},{"content":"3. O FastAPI esvazia a mem&#xf3;ria da Janela Deslizante (RAM) para n&#xe3;o contaminar as m&#xe9;tricas do novo chat com o hist&#xf3;rico do chat anterior.","children":[],"payload":{"tag":"li","lines":"25,26","listIndex":3}}],"payload":{"tag":"li","lines":"22,26"}}],"payload":{"tag":"h3","lines":"21,22"}},{"content":"O Evento de &quot;Auto-Cura&quot; (Self-Healing)","children":[{"content":"&#xc0;s vezes, o React da interface original &quot;percebe&quot; que um elemento estranho (o seu Term&#xf4;metro) foi injetado na &#xe1;rvore dele e &quot;limpa&quot; a div.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"O <code>MutationObserver</code> da extens&#xe3;o vigia a <em>pr&#xf3;pria</em> exist&#xea;ncia do Term&#xf4;metro. Se detectar que ele sumiu indevidamente, o script redesenha o gr&#xe1;fico instantaneamente usando os &#xfa;ltimos scores salvos em mem&#xf3;ria.","children":[],"payload":{"tag":"li","lines":"28,30"}}],"payload":{"tag":"h3","lines":"26,27"}}],"payload":{"tag":"h2","lines":"20,21"}},{"content":"4. O Problema do Escopo Isolado (CORS e CSP)","children":[{"content":"Content Security Policy (CSP)","children":[{"content":"Sites de IA possuem pol&#xed;ticas de seguran&#xe7;a estritas. Se a sua extens&#xe3;o tentar injetar um gr&#xe1;fico puxando imagens externas ou executando scripts hospedados no seu servidor Ubuntu diretamente, o navegador bloquear&#xe1; a a&#xe7;&#xe3;o.","children":[],"payload":{"tag":"li","lines":"32,33"}}],"payload":{"tag":"h3","lines":"31,32"}},{"content":"A Solu&#xe7;&#xe3;o","children":[{"content":"Todo o c&#xf3;digo execut&#xe1;vel (<code>.js</code>) e todo o CSS de estilo do &quot;Term&#xf4;metro&quot; devem vir pr&#xe9;-empacotados no arquivo <code>manifest.json</code> e injetados de forma segura como <em>Web Components</em> (Shadow DOM), garantindo que a sua extens&#xe3;o n&#xe3;o fira a pol&#xed;tica CSP do site hospedeiro.","children":[],"payload":{"tag":"li","lines":"34,35"}}],"payload":{"tag":"h3","lines":"33,34"}}],"payload":{"tag":"h2","lines":"30,31"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
