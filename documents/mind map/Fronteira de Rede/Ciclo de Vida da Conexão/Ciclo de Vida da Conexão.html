&#xe1;rio entra em suspens&#xe3;o ou perde a rede (ex: troca de Wi-Fi para 4G).","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"Rea&#xe7;&#xe3;o do Cliente (Extens&#xe3;o)","children":[{"content":"A API nativa de WebSockets do navegador emite o evento <code>onclose</code>.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"O <code>Service Worker</code> encerra o ciclo de vida daquela sess&#xe3;o e paralisa a captura de tela.","children":[],"payload":{"tag":"li","lines":"29,30"}}],"payload":{"tag":"h3","lines":"27,28"}},{"content":"Rea&#xe7;&#xe3;o do Servidor (Edge)","children":[{"content":"O FastAPI detecta a quebra imediata do duto de rede (exce&#xe7;&#xe3;o <code>WebSocketDisconnect</code>).","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"<strong>Limpeza de Mem&#xf3;ria (Garbage Collection):</strong> O backend deleta o buffer da &quot;Janela Deslizante&quot; alocado na mem&#xf3;ria RAM do notebook, prevenindo vazamento de mem&#xf3;ria (Memory Leak) ao longo de semanas de uso.","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"<strong>Resfriamento de Hardware:</strong> Sem conex&#xf5;es ativas, o sistema entra em repouso, permitindo que o Ollama eventualmente descarregue os modelos da VRAM da GeForce 940MX.","children":[],"payload":{"tag":"li","lines":"33,34"}}],"payload":{"tag":"h3","lines":"30,31"}}],"payload":{"tag":"h2","lines":"22,23"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
