yload":{"tag":"li","lines":"7,9"}},{"content":"<strong>Edge -&gt; Client (Downstream):</strong>","children":[{"content":"Pacotes de Score: <code>{ type: &quot;score_update&quot;, msg_id: &quot;123&quot;, entropia: 0.56, fidelidade: 0.83 }</code>","children":[],"payload":{"tag":"li","lines":"10,12"}}],"payload":{"tag":"li","lines":"9,12"}}],"payload":{"tag":"h3","lines":"6,7"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"2. Infraestrutura de Exposi&#xe7;&#xe3;o (T&#xfa;nel Reverso)","children":[{"content":"O Desafio F&#xed;sico (NAT e IP Din&#xe2;mico)","children":[{"content":"O seu notebook Ubuntu est&#xe1; atr&#xe1;s de um roteador dom&#xe9;stico/faculdade (sem IP p&#xfa;blico fixo e com portas bloqueadas pelo provedor).","children":[],"payload":{"tag":"li","lines":"14,15"}}],"payload":{"tag":"h3","lines":"13,14"}},{"content":"A Solu&#xe7;&#xe3;o: Cloudflare Tunnel (<code>cloudflared</code>)","children":[{"content":"<strong>Como Funciona:</strong> Um cont&#xea;iner Docker rodando no seu notebook inicia uma conex&#xe3;o de sa&#xed;da (outbound) para a rede global da Cloudflare. A Cloudflare gera uma URL p&#xfa;blica (ex: <code>seu-tcc.trycloudflare.com</code>).","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<strong>Roteamento Transparente:</strong> Quando a extens&#xe3;o no celular acessa essa URL, a Cloudflare roteia o tr&#xe1;fego por dentro desse t&#xfa;nel j&#xe1; aberto at&#xe9; a porta <code>8000</code> do seu FastAPI local.","children":[],"payload":{"tag":"li","lines":"17,18"}}],"payload":{"tag":"h3","lines":"15,16"}},{"content":"Criptografia NATIVA","children":[{"content":"A Cloudflare aplica certificados SSL/TLS automaticamente na URL. O tr&#xe1;fego passa a ser criptografado de ponta a ponta (WSS - WebSocket Secure), o que &#xe9; obrigat&#xf3;rio, pois navegadores modernos bloqueiam conex&#xf5;es n&#xe3;o seguras (WS) originadas de p&#xe1;ginas seguras (HTTPS dos LLMs).","children":[],"payload":{"tag":"li","lines":"19,21"}}],"payload":{"tag":"h3","lines":"18,19"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"3. Seguran&#xe7;a e Controle de Acesso","children":[{"content":"Prote&#xe7;&#xe3;o do Endpoint P&#xfa;blico","children":[{"content":"Como a URL do t&#xfa;nel ficar&#xe1; exposta na internet, &#xe9; necess&#xe1;rio evitar que terceiros enviem requisi&#xe7;&#xf5;es e sobrecarreguem sua GPU.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Autentica&#xe7;&#xe3;o Simples:</strong> A extens&#xe3;o injeta um <em>Token de Autoriza&#xe7;&#xe3;o</em> ou uma <em>API Key</em> est&#xe1;tica definida por voc&#xea; no momento de fechar o Handshake (abertura) do WebSocket. Se o token n&#xe3;o bater, o FastAPI derruba a conex&#xe3;o imediatamente.","children":[],"payload":{"tag":"li","lines":"24,25"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"Tratamento de CORS (Cross-Origin Resource Sharing)","children":[{"content":"O FastAPI precisar&#xe1; ser configurado para aceitar conex&#xf5;es originadas estritamente das extens&#xf5;es rodando nos dom&#xed;nios alvo (<code>chatgpt.com</code>, <code>claude.ai</code>, <code>gemini.google.com</code>), rejeitando tentativas de conex&#xe3;o de sites arbitr&#xe1;rios.","children":[],"payload":{"tag":"li","lines":"26,28"}}],"payload":{"tag":"h3","lines":"25,26"}}],"payload":{"tag":"h2","lines":"21,22"}},{"content":"4. Ciclo de Vida da Conex&#xe3;o","children":[{"content":"1. Handshake (Aperto de M&#xe3;o)","children":[{"content":"O usu&#xe1;rio abre o ChatGPT. O Service Worker da extens&#xe3;o l&#xea; a URL no <code>LocalStorage</code> e envia o pedido de conex&#xe3;o (Upgrade para WSS) com a chave de seguran&#xe7;a.","children":[],"payload":{"tag":"li","lines":"30,31"}}],"payload":{"tag":"h3","lines":"29,30"}},{"content":"2. Keep-Alive (Ping/Pong)","children":[{"content":"Para evitar que o t&#xfa;nel da Cloudflare derrube a conex&#xe3;o por inatividade enquanto o usu&#xe1;rio apenas l&#xea; a tela, a extens&#xe3;o envia um pacote leve de <code>ping</code> a cada 30 segundos, e o servidor responde com <code>pong</code>.","children":[],"payload":{"tag":"li","lines":"32,33"}}],"payload":{"tag":"h3","lines":"31,32"}},{"content":"3. Desconex&#xe3;o (Teardown)","children":[{"content":"Se o usu&#xe1;rio fechar a aba ou mudar de site, o WebSocket dispara o evento <code>onclose</code>. O FastAPI no Edge detecta isso e limpa a &quot;Janela Deslizante&quot; da mem&#xf3;ria RAM para liberar espa&#xe7;o.","children":[],"payload":{"tag":"li","lines":"34,35"}}],"payload":{"tag":"h3","lines":"33,34"}}],"payload":{"tag":"h2","lines":"28,29"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
