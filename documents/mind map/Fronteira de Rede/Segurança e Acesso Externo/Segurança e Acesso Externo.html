e3;o persistente e segura com os servidores globais da Cloudflare.","children":[],"payload":{"tag":"li","lines":"11,12"}}],"payload":{"tag":"h3","lines":"10,11"}},{"content":"O Roteamento Reverso","children":[{"content":"A Cloudflare te fornece um dom&#xed;nio (ex: <code>seu-tcc.trycloudflare.com</code>).","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"Quando a extens&#xe3;o do celular acessa essa URL, a requisi&#xe7;&#xe3;o entra na infraestrutura da Cloudflare e desce &quot;por dentro&quot; do t&#xfa;nel pr&#xe9;-estabelecido diretamente para a porta <code>8000</code> do seu cont&#xea;iner FastAPI.","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"<strong>Vantagem:</strong> O roteador da sua casa n&#xe3;o bloqueia conex&#xf5;es de sa&#xed;da, logo, funciona em qualquer rede (Wi-Fi de faculdade, 4G, rede corporativa).","children":[],"payload":{"tag":"li","lines":"15,17"}}],"payload":{"tag":"h3","lines":"12,13"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"3. Criptografia e Protocolos (Obrigat&#xf3;rio)","children":[{"content":"SSL / TLS Autom&#xe1;tico","children":[{"content":"A Cloudflare aplica um certificado de seguran&#xe7;a v&#xe1;lido na sua URL p&#xfa;blica automaticamente.","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"Todo o tr&#xe1;fego entre o navegador do celular e a rede da Cloudflare &#xe9; fortemente criptografado (HTTPS).","children":[],"payload":{"tag":"li","lines":"20,21"}}],"payload":{"tag":"h3","lines":"18,19"}},{"content":"O Requisito WSS (WebSocket Secure)","children":[{"content":"Extens&#xf5;es injetadas em sites seguros (como <code>https://chatgpt.com</code>) t&#xea;m uma restri&#xe7;&#xe3;o de seguran&#xe7;a r&#xed;gida pelo navegador: elas <strong>n&#xe3;o podem</strong> abrir conex&#xf5;es <code>ws://</code> (inseguras), apenas <code>wss://</code> (seguras).","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"O Cloudflare Tunnel resolve isso envelopando o seu WebSocket local nativamente com SSL.","children":[],"payload":{"tag":"li","lines":"23,25"}}],"payload":{"tag":"h3","lines":"21,22"}}],"payload":{"tag":"h2","lines":"17,18"}},{"content":"4. Camadas de Prote&#xe7;&#xe3;o da Aplica&#xe7;&#xe3;o (No Servidor)","children":[{"content":"Valida&#xe7;&#xe3;o de Token no Handshake","children":[{"content":"Como a sua URL est&#xe1; p&#xfa;blica, ferramentas automatizadas tentar&#xe3;o acess&#xe1;-la.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"<strong>A Defesa:</strong> A sua extens&#xe3;o envia um cabe&#xe7;alho de autoriza&#xe7;&#xe3;o oculto (<code>Authorization: Bearer TCC-Key-123</code>) na tentativa de conex&#xe3;o ao WebSocket.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Se a chave estiver errada, o FastAPI recusa a conex&#xe3;o no primeiro milissegundo, blindando a GPU de processar lixo de terceiros.","children":[],"payload":{"tag":"li","lines":"29,30"}}],"payload":{"tag":"h3","lines":"26,27"}},{"content":"Valida&#xe7;&#xe3;o de Origem (CORS Estrito)","children":[{"content":"O servidor Edge &#xe9; configurado para validar o cabe&#xe7;alho <code>Origin</code> da requisi&#xe7;&#xe3;o.","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"A conex&#xe3;o s&#xf3; &#xe9; aceita se vier estritamente de <code>https://chatgpt.com</code>, <code>https://claude.ai</code> ou <code>https://gemini.google.com</code>. Qualquer outro site tentando se conectar recebe um erro <code>403 Forbidden</code>.","children":[],"payload":{"tag":"li","lines":"32,34"}}],"payload":{"tag":"h3","lines":"30,31"}}],"payload":{"tag":"h2","lines":"25,26"}},{"content":"5. Implementa&#xe7;&#xe3;o na Infraestrutura (Docker)","children":[{"content":"Isolamento de Rede","children":[{"content":"O daemon do <code>cloudflared</code> roda em um cont&#xea;iner Docker pr&#xf3;prio.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"Ele compartilha a mesma <em>Bridge Network</em> (rede interna do
