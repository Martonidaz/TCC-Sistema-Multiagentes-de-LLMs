z e &quot;promovem&quot; a conex&#xe3;o para o protocolo WebSocket.","children":[],"payload":{"tag":"li","lines":"11,12"}}],"payload":{"tag":"h3","lines":"10,11"}},{"content":"Canal Aberto Permanente","children":[{"content":"O duto de rede permanece aberto. Os dados fluem em duas vias simult&#xe2;neas (Upstream: fragmentos de texto; Downstream: envio dos scores) com lat&#xea;ncia de rede virtualmente zero.","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"h3","lines":"12,13"}},{"content":"Execu&#xe7;&#xe3;o Ass&#xed;ncrona (Event-Driven)","children":[{"content":"O navegador e o servidor processam os pacotes atrav&#xe9;s de um &quot;Event Loop&quot;. Isso significa que as fun&#xe7;&#xf5;es rodam em segundo plano e a interface gr&#xe1;fica (UI) do usu&#xe1;rio nunca &#xe9; bloqueada aguardando o processamento do servidor Edge.","children":[],"payload":{"tag":"li","lines":"15,17"}}],"payload":{"tag":"h3","lines":"14,15"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"3. Engenharia de Streaming (Chunking)","children":[{"content":"Otimiza&#xe7;&#xe3;o de Envio (Throttle/Debounce)","children":[{"content":"O <code>MutationObserver</code> n&#xe3;o envia os dados letra por letra pela rede.","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"Ele acumula os caracteres em um buffer tempor&#xe1;rio no JavaScript.","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"A cada &quot;X&quot; milissegundos (ex: 500ms) ou ao detectar pontua&#xe7;&#xe3;o (fim de frase), ele dispara um pacote (&quot;chunk&quot;) consolidado.","children":[],"payload":{"tag":"li","lines":"21,22"}}],"payload":{"tag":"h3","lines":"18,19"}},{"content":"Buffer no Servidor Edge","children":[{"content":"O FastAPI recebe os chunks parciais e os anexa &#xe0; mem&#xf3;ria da &quot;Janela Deslizante&quot;.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"Dispara o processamento na GPU (Ollama) para atualizar o score parcial e o devolve instantaneamente.","children":[],"payload":{"tag":"li","lines":"24,26"}}],"payload":{"tag":"h3","lines":"22,23"}}],"payload":{"tag":"h2","lines":"17,18"}},{"content":"4. Sincroniza&#xe7;&#xe3;o de Estado (Rastreamento)","children":[{"content":"Identificadores &#xda;nicos (MsgID)","children":[{"content":"Cada intera&#xe7;&#xe3;o de prompt/resposta recebe um identificador &#xfa;nico (UUID) gerado pela extens&#xe3;o no in&#xed;cio do envio (ex: <code>msg-id-7A9B</code>).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Todos os blocos de texto subindo para o servidor e todos os c&#xe1;lculos matem&#xe1;ticos descendo para a extens&#xe3;o carregam esse <code>msg_id</code>.","children":[],"payload":{"tag":"li","lines":"29,30"}}],"payload":{"tag":"h3","lines":"27,28"}},{"content":"Atualiza&#xe7;&#xe3;o Cir&#xfa;rgica do DOM","children":[{"content":"Ao receber o JSON via WebSocket (<code>{ msg_id: &quot;msg-id-7A9B&quot;, entropia: 0.88 }</code>), o JavaScript busca exatamente a div de resposta que possui esse ID e atualiza apenas a barra gr&#xe1;fica dela, evitando re-renderizar a p&#xe1;gina inteira.","children":[],"payload":{"tag":"li","lines":"31,33"}}],"payload":{"tag":"h3","lines":"30,31"}}],"payload":{"tag":"h2","lines":"26,27"}},{"content":"5. Resili&#xea;ncia de Conex&#xe3;o","children":[{"content":"Keep-Alive (Ping/Pong)","children":[{"content":"Para evitar que o t&#xfa;nel (Cloudflare) encerre a conex&#xe3;o por inatividade enquanto o usu&#xe1;rio apenas l&#xea; a resposta, envia-se um pacote min&#xfa;sculo (ping) a cada 30 segundos.","children":[],"payload":{"tag":"li","lines":"35,36"}}],"payload":{"tag":"h3","lines":"34,35"}},{"content":"Reconex&#xe3;o Autom&#xe1;tica (Exponential Backoff)","children":[{"content":"Se a rede do usu&#xe1;rio falhar momentaneamente (ex: oscila&#xe7;&#xe3;o no 4G), o script tenta reconectar ao servidor silenciosamente aumentando o tempo de espera (1s, 2s, 4s, 8s...) para evitar ataques de nega&#xe7;&#xe3;o de servi&#xe7;o (DDoS) acidentais no seu pr&#xf3;prio notebook.","children":[],"payload":{"tag":"li","lines":"37,38"}}],"payload":{"tag":"h3","lines":"36,37"}}],"payload":{"tag":"h2","lines":"33,34"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
