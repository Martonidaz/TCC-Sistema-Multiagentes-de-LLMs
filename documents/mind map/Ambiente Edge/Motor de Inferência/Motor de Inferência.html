<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script><script>(e=>{window.WebFontConfig={custom:{families:["KaTeX_AMS","KaTeX_Caligraphic:n4,n7","KaTeX_Fraktur:n4,n7","KaTeX_Main:n4,n7,i4,i7","KaTeX_Math:i4,i7","KaTeX_Script","KaTeX_SansSerif:n4,n7,i4","KaTeX_Size1","KaTeX_Size2","KaTeX_Size3","KaTeX_Size4","KaTeX_Typewriter"]},active:()=>{e().refreshHook.call()}}})(()=>window.markmap)</script><script src="https://cdn.jsdelivr.net/npm/webfontloader@1.6.28/webfontloader.js" defer></script><script>(()=>{setTimeout(()=>{const{markmap:S,mm:Q}=window,$=new S.Toolbar;$.attach(Q);const I=$.render();I.setAttribute("style","position:absolute;bottom:20px;right:20px"),document.body.append(I)})})()</script><script>((l,U,M,R)=>{const N=l();window.mm=N.Markmap.create("svg#mindmap",(U||N.deriveOptions)(R),M),window.matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.classList.add("markmap-dark")})(()=>window.markmap,null,{"content":"Motor de Infer&#xea;ncia (Restrito por Hardware)","children":[{"content":"1. Infraestrutura Base (Docker + Ollama)","children":[{"content":"Isolamento e Controle de Ambiente","children":[{"content":"<strong>Docker Engine:</strong> Isola as depend&#xea;ncias do servidor Edge, garantindo que o c&#xf3;digo rode exatamente da mesma forma no seu notebook ou em qualquer outra m&#xe1;quina de teste.","children":[],"payload":{"tag":"li","lines":"4,5"}},{"content":"<strong>NVIDIA Container Toolkit:</strong> O &quot;ponteiro&quot; obrigat&#xf3;rio. Permite que o cont&#xea;iner do Docker acesse o hardware f&#xed;sico da placa de v&#xed;deo nativamente para acelera&#xe7;&#xe3;o de c&#xe1;lculo matricial.","children":[],"payload":{"tag":"li","lines":"5,6"}}],"payload":{"tag":"h3","lines":"3,4"}},{"content":"O Papel do Ollama","children":[{"content":"Atua como um servidor HTTP local gerenciador de modelos, simplificando o carregamento din&#xe2;mico de pesos neurais.","children":[],"payload":{"tag":"li","lines":"7,8"}},{"content":"Em vez de lidar com a complexidade de tensores puros via PyTorch/HuggingFace, o Ollama abstrai a infer&#xea;ncia, permitindo chamadas via API REST (<code>localhost:11434/api/generate</code> ou <code>/api/embeddings</code>).","children":[],"payload":{"tag":"li","lines":"8,10"}}],"payload":{"tag":"h3","lines":"6,7"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"2. Gest&#xe3;o de VRAM (Otimizado para GeForce 940MX 2GB)","children":[{"content":"O Gargalo Arquitet&#xf4;nico","children":[{"content":"Modelos LLM padr&#xf5;es (como Llama 3 8B) exigem entre 6GB e 8GB de VRAM apenas para carregar os pesos na mem&#xf3;ria de v&#xed;deo.","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"Com apenas 2GB dispon&#xed;veis na 940MX, o limite &#xe9; extremamente restrito, n&#xe3;o havendo margem para manter m&#xfa;ltiplos modelos pesados carregados simultaneamente.","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"h3","lines":"11,12"}},{"content":"Estrat&#xe9;gia de Descarregamento (VRAM Offloading)","children":[{"content":"<strong>Comportamento Din&#xe2;mico:</strong> O Ollama avalia a mem&#xf3;ria em tempo real. Se o modelo ultrapassar o limite de 2GB da GPU, ele envia &quot;camadas&quot; excedentes do modelo (layers) para a mem&#xf3;ria RAM do notebook (CPU).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>O Trade-off (Troca):</strong> O processamento na VRAM &#xe9; de alt&#xed;ssima velocidade. O que vai para a RAM sofre lentid&#xe3;o severa. O objetivo da engenharia aqui &#xe9; manter 100% das camadas na VRAM para garantir o processamento em tempo real exigido pela extens&#xe3;o.","children":[],"payload":{"tag":"li","lines":"16,17"}}],"payload":{"tag":"h3","lines":"14,15"}},{"content":"Keep-Alive Limitado","children":[{"content":"O motor descarrega os modelos da VRAM automaticamente ap&#xf3;s a ociosidade (ex: 5 minutos sem receber pacotes do cliente) para esfriar a placa e economizar energia do notebook.","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"h3","lines":"17,18"}}],"payload":{"tag":"h2","lines":"10,11"}},{"content":"3. SLM Quantizado (Small Language Model)","children":[{"content":"A Ci&#xea;ncia da Quantiza&#xe7;&#xe3;o","children":[{"content":"O processo de reduzir a precis&#xe3;o matem&#xe1;tica dos &quot;pesos&quot; da rede neural. Um modelo em <code>FP16</code> (16-bits) &#xe9; matematicamente espremido para <code>Q4</code> (4-bits) ou <code>Q8</code> (8-bits).","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"Isso reduz drasticamente o peso em disco e VRAM. Um modelo de 1 Bilh&#xe3;o de par&#xe2;metros (ex: Llama-3.2-1B) que usaria ~2GB em FP16, cai para ~1.3GB em <code>Q4</code>, cabendo com folga na 940MX.","children":[],"payload":{"tag":"li","lines":"23,24"}}],"payload":{"tag":"h3","lines":"21,22"}},{"content":"Atribui&#xe7;&#xe3;o 1: Otimizador de Prompts (Text-to-Text)","children":[{"content":"Utiliza a capacidade de gera&#xe7;&#xe3;o de texto do SLM.","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"Recebe o <em>System Prompt</em> engessado pelo servidor (focado em <em>Query Rewriting</em>) e reconstr&#xf3;i o texto cru do usu&#xe1;rio para mitigar ambiguidades antes do envio &#xe0; IA comercial.","children":[],"payload":{"tag":"li","lines":"26,27"}}],"payload":{"tag":"h3","lines":"24,25"}},{"content":"Atribui&#xe7;&#xe3;o 2: C&#xe1;lculo de Entropia (Logprobs)","children":[{"content":"N&#xe3;o gera texto novo, atua como &quot;Juiz&quot;. A extens&#xe3;o do cliente envia um fragmento de texto j&#xe1; gerado pelo Gemini/Claude.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"O SLM calcula qual a probabilidade que <em>ele</em> teria de gerar aquelas exatas palavras. Retorna os <code>logprobs</code> (logaritmos de probabilidade das palavras).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"O FastAPI pega esses tensores e roda a equa&#xe7;&#xe3;o de Shannon: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mo>&#x2212;</mo><mo>&#x2211;</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mi>log</mi><mo>&#x2061;</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">H(X) = - \\sum P(x) \\log P(x)</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.08125em;\">H</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\" style=\"margin-right:0.07847em;\">X</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">&#x2211;</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\">x</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mop\">lo<span style=\"margin-right:0.01389em;\">g</span></span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\">x</span><span class=\"mclose\">)</span></span></span></span> medindo a incerteza estat&#xed;stica (Alucina&#xe7;&#xe3;o Sem&#xe2;ntica).","children":[],"payload":{"tag":"li","lines":"30,32"}}],"payload":{"tag":"h3","lines":"27,28"}}],"payload":{"tag":"h2","lines":"20,21"}},{"content":"4. Modelo de Embeddings (C&#xe1;lculo Factual e Contextual)","children":[{"content":"Efici&#xea;ncia Extrema","children":[{"content":"Modelos focados exclusivamente em transformar texto em n&#xfa;meros, sem capacidade de conversar (ex: <code>nomic-embed-text</code> ou <code>all-MiniLM-L6-v2</code>).","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Pesam &#xed;nfimos ~250MB, rodando quase imperceptivelmente na VRAM da 940MX junto com o SLM, sem causar estouro de mem&#xf3;ria (Out-Of-Memory - OOM).","children":[],"payload":{"tag":"li","lines":"35,36"}}],"payload":{"tag":"h3","lines":"33,34"}},{"content":"Atribui&#xe7;&#xe3;o 1: Fidelidade (M&#xe9;tricas RAGAS)","children":[{"content":"Converte a &quot;Janela Deslizante&quot; (Contexto fornecido pelo usu&#xe1;rio nas &#xfa;ltimas mensagens) em Vetor A.","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"Converte a Resposta em streaming capturada pela extens&#xe3;o em Vetor B.","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"O backend calcula a Similaridade do Cosseno entre os vetores. Valores baixos alertam ao usu&#xe1;rio (via UI do navegador) que o modelo come&#xe7;ou a inventar dados fora do contexto estabelecido.","children":[],"payload":{"tag":"li","lines":"39,40"}}],"payload":{"tag":"h3","lines":"36,37"}},{"content":"Atribui&#xe7;&#xe3;o 2: Roteamento Sem&#xe2;ntico","children":[{"content":"Converte o novo prompt do usu&#xe1;rio em um vetor no momento em que ele termina de digitar.","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"Este vetor num&#xe9;rico &#xe9; o dado fundamental que o Agente Roteador envia para o banco de dados <code>IndexedDB</code> no cliente para comparar historicamente se o modelo atual &#xe9; a melhor escolha.","children":[],"payload":{"tag":"li","lines":"42,43"}}],"payload":{"tag":"h3","lines":"40,41"}}],"payload":{"tag":"h2","lines":"32,33"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
