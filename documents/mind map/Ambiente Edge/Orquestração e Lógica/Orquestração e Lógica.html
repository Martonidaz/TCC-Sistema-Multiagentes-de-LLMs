;ria","children":[{"content":"<strong>Dicion&#xe1;rio de Sess&#xf5;es:</strong> Mapeia cada conex&#xe3;o ativa atrav&#xe9;s de um <code>msg_id</code> &#xfa;nico gerado pela extens&#xe3;o.","children":[],"payload":{"tag":"li","lines":"7,8"}},{"content":"<strong>Buffer da Janela Deslizante (Sliding Window):</strong> Armazena estritamente as &#xfa;ltimas 3 intera&#xe7;&#xf5;es (prompt e resposta) na mem&#xf3;ria RAM. Ao receber a 4&#xaa; intera&#xe7;&#xe3;o, descarta a mais antiga (FIFO - First In, First Out) para evitar o estouro do limite de contexto do modelo (e consequentemente o limite da VRAM).","children":[],"payload":{"tag":"li","lines":"8,9"}}],"payload":{"tag":"h3","lines":"6,7"}},{"content":"Interface com o Motor de Infer&#xea;ncia","children":[{"content":"<strong>Cliente HTTP Ass&#xed;ncrono (<code>httpx</code>):</strong> Executa requisi&#xe7;&#xf5;es REST internas (para <code>localhost:11434</code> do Ollama) sem travar as threads do servidor, permitindo que a CPU do notebook continue livre para orquestrar outras tarefas.","children":[],"payload":{"tag":"li","lines":"10,12"}}],"payload":{"tag":"h3","lines":"9,10"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"2. LangGraph (A Arquitetura Multi-Agente)","children":[{"content":"O Conceito de Grafo de Estado (StateGraph)","children":[{"content":"<strong>O Estado Global (State):</strong> O cora&#xe7;&#xe3;o do LangGraph. &#xc9; um objeto (ex: <code>TypedDict</code> em Python) que transita entre os Agentes. Carrega dados como: <code>prompt_atual</code>, <code>vetores_contexto</code>, <code>prompt_reescrito</code> e <code>scores_metricos</code>.","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"<strong>N&#xf3;s (Nodes):</strong> Representam os Agentes. S&#xe3;o fun&#xe7;&#xf5;es isoladas que pegam o Estado atual, processam sua fun&#xe7;&#xe3;o espec&#xed;fica no Ollama, e atualizam o Estado.","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Arestas Condicionais (Conditional Edges):</strong> Roteadores l&#xf3;gicos do fluxo de trabalho. Exemplo l&#xf3;gico: <em>Se o Agente Roteador determinar que o prompt original j&#xe1; &#xe9; excelente, a Aresta pula o Agente Otimizador e vai direto para a conclus&#xe3;o do pr&#xe9;-envio.</em>","children":[],"payload":{"tag":"li","lines":"16,18"}}],"payload":{"tag":"h3","lines":"13,14"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"3. O Comportamento dos Agentes (N&#xf3;s do Grafo)","children":[{"content":"N&#xf3; 1: Agente Roteador Sem&#xe2;ntico","children":[{"content":"<strong>Gatilho:</strong> Recebe o prompt rec&#xe9;m-digitado pelo usu&#xe1;rio.","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"<strong>A&#xe7;&#xe3;o:</strong> Utiliza o modelo de embeddings do Ollama para converter o prompt em um vetor.","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"<strong>Integra&#xe7;&#xe3;o:</strong> Devolve o vetor via WebSocket para a extens&#xe3;o realizar a busca de similaridade no banco local (IndexedDB) e sugerir o melhor LLM para aquela tarefa.","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"h3","lines":"19,20"}},{"content":"N&#xf3; 2: Agente Otimizador (Query Rewriting)","children":[{"content":"<strong>Gatilho:</strong> Recebe a confirma&#xe7;&#xe3;o de que o usu&#xe1;rio aceitou a sugest&#xe3;o de melhorar o prompt.","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"<strong>A&#xe7;&#xe3;o:</strong> Injeta o prompt cru do usu&#xe1;rio em um <em>System Prompt</em> oculto.","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<strong>Prompt do Sistema (Engessado):</strong> <em>&quot;Voc&#xea; &#xe9; um especialista em estrutura&#xe7;&#xe3;o de dados. N&#xe3;o responda &#xe0; requisi&#xe7;&#xe3;o do usu&#xe1;rio. Apenas reescreva a solicita&#xe7;&#xe3;o dele adicionando clareza de inten&#xe7;&#xe3;o, formato de sa&#xed;da e restri&#xe7;&#xf5;es de contexto&quot;</em>.","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<strong>Sa&#xed;da:</strong> Substitui silenciosamente o texto do usu&#xe1;rio na caixa de digita&#xe7;&#xe3;o.","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"N&#xf3; 3: Agente Avaliador (Cr&#xed;tico em Tempo de Infer&#xea;ncia)","children":[{"content":"<strong>Gatilho:</strong> Recebimento do fluxo cont&#xed;nuo de palavras enquanto o LLM gera a resposta na tela.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>C&#xe1;lculo da Entropia:</strong> Envia o fragmento para o SLM (Llama 3.2 1B) solicitando o retorno dos <code>logprobs</code>. Aplica a equa&#xe7;&#xe3;o de Shannon <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mo>&#x2212;</mo><mo>&#x2211;</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mi>log</mi><mo>&#x2061;</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">H(X) = - \\sum P(x) \\log P(x)</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.08125em;\">H</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\" style=\"margin-right:0.07847em;\">X</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">&#x2211;</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\">x</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mop\">lo<span style=\"margin-right:0.01389em;\">g</span></span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.13889em;\">P</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\">x</span><span class=\"mclose\">)</span></span></span></span> sobre as probabilidades extra&#xed;das para quantificar matematicamente a &quot;incerteza&quot; do LLM ao gerar aquele texto.","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"<strong>C&#xe1;lculo de Fidelidade (RAGAS):</strong> Passa a &quot;Janela Deslizante&quot; (Contexto) e a resposta gerada para o modelo de Embeddings. Calcula a Similaridade do Cosseno entre os dois vetores. Se o vetor da resposta divergir agressivamente do vetor do contexto, a pontua&#xe7;&#xe3;o de Fidelidade cai (indicando poss&#xed;vel alucina&#xe7;&#xe3;o).","children":[],"payload":{"tag":"li","lines":"31,33"}}],"payload":{"tag":"h3","lines":"28,29"}}],"payload":{"tag":"h2","lines":"18,19"}},{"content":"4. Orquestra&#xe7;&#xe3;o do Ciclo de Execu&#xe7;&#xe3;o","children":[{"content":"Pipeline S&#xed;ncrono (O Roteamento)","children":[{"content":"Etapa controlada por <em>pausas</em>. O LangGraph atinge o N&#xf3; 1 (Roteador), devolve a informa&#xe7;&#xe3;o ao FastAPI e <strong>suspende</strong> a execu&#xe7;&#xe3;o daquele Grafo aguardando a decis&#xe3;o do usu&#xe1;rio (clicar em aceitar ou rejeitar a otimiza&#xe7;&#xe3;o na tela).","children":[],"payload":{"tag":"li","lines":"35,36"}}],"payload":{"tag":"h3","lines":"34,35"}},{"content":"Pipeline Cont&#xed;nuo (O Monitoramento)","children":[{"content":"Disparado no envio da mensagem. Opera atrav&#xe9;s de <em>Background Tasks</em> no FastAPI. O Agente Avaliador &#xe9; chamado repetidamente de forma c&#xed;clica para pequenas parcelas de texto, enviando as notas parciais imediatamente via WSS para animar os gr&#xe1;ficos do &quot;Term&#xf4;metro&quot; no navegador.","children":[],"payload":{"tag":"li","lines":"37,38"}}],"payload":{"tag":"h3","lines":"36,37"}}],"payload":{"tag":"h2","lines":"33,34"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
